<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
  <rect width="760" height="250" fill="#ffffff"/>

  <!-- label -->
  <text x="8" y="20" font-size="11" fill="#61666b">输入框上方</text>

  <!-- shortcut chips -->
  <g>
    <rect x="8" y="32" width="62" height="32" rx="12" fill="#ffffff" stroke="#0000001a" stroke-width="1"/>
    <text x="39" y="53" font-size="13" fill="#61666b" text-anchor="middle">总结</text>

    <rect x="80" y="32" width="62" height="32" rx="12" fill="#ffffff" stroke="#0000001a" stroke-width="1"/>
    <text x="111" y="53" font-size="13" fill="#61666b" text-anchor="middle">继续</text>

    <rect x="152" y="32" width="86" height="32" rx="12" fill="#ffffff" stroke="#0000001a" stroke-width="1"/>
    <text x="195" y="53" font-size="13" fill="#61666b" text-anchor="middle">代码审查</text>
  </g>

  <!-- trailing controls, right aligned -->
  <g>
    <rect x="566" y="32" width="94" height="32" rx="12" fill="#ffffff" stroke="#0000001a" stroke-width="1"/>
    <path d="M580 47 L586 53 L592 47" fill="none" stroke="#61666b" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="598" y="53" font-size="13" fill="#61666b">更多</text>
    <rect x="636" y="37" width="17" height="17" rx="9" fill="#2631480f"/>
    <text x="644.5" y="50" font-size="11" fill="#61666b" text-anchor="middle">4</text>

    <rect x="670" y="32" width="82" height="32" rx="12" fill="#ffffff" stroke="#0000001a" stroke-width="1"/>
    <path d="M684 41 v12 M678 47 h12" stroke="#61666b" stroke-width="1.4" stroke-linecap="round"/>
    <text x="698" y="53" font-size="13" fill="#61666b">添加指令</text>
  </g>

  <!-- composer card -->
  <rect x="8" y="96" width="744" height="140" rx="28" fill="#ffffff" stroke="#0000001a" stroke-width="1"/>
  <text x="36" y="140" font-size="13" fill="#a8adb3">发消息或创建任务，/ 调用指令，@ 文件或对话</text>

  <!-- composer toolbar hints -->
  <circle cx="44" cy="200" r="14" fill="#2631480f"/>
  <path d="M44 194 v12 M38 200 h12" stroke="#61666b" stroke-width="1.4" stroke-linecap="round"/>
  <text x="74" y="205" font-size="13" fill="#61666b">工作区内修改</text>
  <text x="196" y="205" font-size="13" fill="#61666b">本地</text>

  <text x="8" y="58" font-size="11" fill="#61666b" opacity="0">.</text>
</svg>
